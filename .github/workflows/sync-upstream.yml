name: Sync File from Upstream Repo

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 1 * * *' # Mỗi ngày lúc 1:00 UTC
  workflow_dispatch: # Cho phép chạy tay

jobs:
  sync-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Download upstream file
        run: |
          curl https://raw.githubusercontent.com/ConnersHua/RuleGo/master/Surge/Ruleset/Direct.list -o Direct.lsr
          curl https://raw.githubusercontent.com/ConnersHua/RuleGo/master/Surge/Ruleset/Direct+.list -o DirectPlus.lsr
          curl https://raw.githubusercontent.com/bigdargon/hostsVN/master/option/hostsVN-surge-rule.conf -o Ads.lsr  
          curl https://raw.githubusercontent.com/bigdargon/hostsVN/master/option/hostsVN-surge-exceptions-rule.conf -o Exceptions.lsr  
          curl https://raw.githubusercontent.com/bigdargon/hostsVN/master/option/hostsVN-surge-OTA.conf -o OTA.lsr      
          curl https://raw.githubusercontent.com/bigdargon/hostsVN/master/option/hostsVN-surge-FB.conf -o FacebookAds.lsr          
          curl https://raw.githubusercontent.com/bigdargon/hostsVN/master/extensions/gambling/surge-rule.conf Gambling.lsr          
          curl https://raw.githubusercontent.com/bigdargon/hostsVN/master/extensions/adult/surge-rule.conf -o Adult.lsr      
          curl https://raw.githubusercontent.com/bigdargon/hostsVN/master/extensions/threat/surge-rule.conf -o Threat.lsr
      - name: Commit & push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Direct.lsr DirectPlus.lsr Ads.lsr Exceptions.lsr OTA.lsr FacebookAds.lsr Gambling.lsr Adult.lsr Threat.lsr  
          git diff --cached --quiet || git commit -m "🔄 Sync from source-repo"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
