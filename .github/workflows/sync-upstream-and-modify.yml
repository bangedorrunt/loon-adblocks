name: Sync File from Hagezi and Prepend DOMAIN-SUFFIX

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Cho phép chạy tay

jobs:
  sync-and-modify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch source file from URL
        run: |
          curl -o HageziMiniSource.txt https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.mini-onlydomains.txt
          curl -o HageziAntiPopAdsSource.txt https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/popupads-onlydomains.txt

      - name: Modify file by prepending DOMAIN-SUFFIX
        run: | 
          SOURCE_FILE1="HageziMiniSource.txt"
          SOURCE_FILE2="HageziAntiPopAdsSource.txt"
          OUTPUT_FILE1="HageziProMini.lsr"
          OUTPUT_FILE2="HageziAntiPopAds.lsr"
          # Check if source file was downloaded
          if [[ ! -f "$SOURCE_FILE1" ]]; then
            echo "Failed to download source file!"
            exit 1
          fi
          if [[ ! -f "$SOURCE_FILE2" ]]; then
            echo "Failed to download second source file!"
            exit 1
          fi
          # Prepend DOMAIN-SUFFIX, handle wildcards, skip invalid entries
          awk 'NR<12 {print} NR>=12 {if ($0 ~ /^[a-zA-Z0-9-]+\.[a-zA-Z0-9.-]+$/) print "DOMAIN-SUFFIX," $0; else if ($0 ~ /^\*\./) print "DOMAIN-SUFFIX," substr($0, 3); else next}' "$SOURCE_FILE1" > "$OUTPUT_FILE1"
          awk 'NR<12 {print} NR>=12 {if ($0 ~ /^[a-zA-Z0-9-]+\.[a-zA-Z0-9.-]+$/) print "DOMAIN-SUFFIX," $0; else if ($0 ~ /^\*\./) print "DOMAIN-SUFFIX," substr($0, 3); else next}' "$SOURCE_FILE2" > "$OUTPUT_FILE2"

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add HageziProMini.lsr HageziAntiPopAds.lsr
          git commit -m "Prepend DOMAIN-SUFFIX, to lines starting from line 12" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
